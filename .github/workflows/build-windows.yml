name: Build Windows test app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install -e ".[build]"
      - name: Build private sign-in helper
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --console
          --onefile
          --name Average-Assistant-SignIn
          --collect-all webview
          --distpath helper-dist
          src/usbc_average_lookup/signin_helper.py
      - name: Build application
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --onedir
          --name USBC-Average-Lookup
          --add-binary "helper-dist/Average-Assistant-SignIn.exe;."
          src/usbc_average_lookup/__main__.py
      - name: Verify packaged sign-in helper starts
        shell: pwsh
        run: |
          $helper = "dist/USBC-Average-Lookup/_internal/Average-Assistant-SignIn.exe"
          $output = (& $helper 1 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "Sign-in helper exited with code $LASTEXITCODE" }
          if ($output -notmatch "AVERAGE_ASSISTANT_AUTH:") { throw "No helper response received" }
          if ($output -match "Failed to resolve Python.Runtime.Loader.Initialize") {
            throw "Python.NET failed to initialize in the packaged helper"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: USBC-Average-Lookup-Windows
          path: dist/USBC-Average-Lookup
          if-no-files-found: error
          retention-days: 14
      - name: Package Windows download
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: >-
          Compress-Archive
          -Path dist/USBC-Average-Lookup
          -DestinationPath USBC-Average-Lookup-Windows.zip
      - name: Publish test release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            USBC-Average-Lookup-Windows.zip `
            --repo $env:GITHUB_REPOSITORY `
            --title "Bowling Manager $env:GITHUB_REF_NAME" `
            --notes "Windows test build with permanent weekly score sheets, team-filtered history, correction logs, league scoring rules, and relationship navigation. Existing SQLite data is upgraded with a pre-upgrade backup. Extract the ZIP and run USBC-Average-Lookup.exe." `
            --prerelease
