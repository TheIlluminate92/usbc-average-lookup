name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Optional tag to create and publish with the tested files"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "packaging/windows/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "packaging/windows/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install -e ".[build]"
      - name: Build private sign-in helper
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --console
          --onefile
          --name Average-Assistant-SignIn
          --collect-all webview
          --distpath helper-dist
          src/usbc_average_lookup/signin_helper.py
      - name: Build application
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --onedir
          --name USBC-Average-Lookup
          --add-binary "helper-dist/Average-Assistant-SignIn.exe;."
          src/usbc_average_lookup/__main__.py
      - name: Verify packaged sign-in helper starts
        shell: pwsh
        run: |
          $helper = "dist/USBC-Average-Lookup/_internal/Average-Assistant-SignIn.exe"
          $output = (& $helper 1 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "Sign-in helper exited with code $LASTEXITCODE" }
          if ($output -notmatch "AVERAGE_ASSISTANT_AUTH:") { throw "No helper response received" }
          if ($output -match "Failed to resolve Python.Runtime.Loader.Initialize") {
            throw "Python.NET failed to initialize in the packaged helper"
          }
      - name: Build Windows installer and portable ZIP
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid app version' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler is not installed on this runner' }
          & $compiler "/DAppVersion=$version" 'packaging/windows/average-assistant.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          Compress-Archive -Path 'dist/USBC-Average-Lookup/*' -DestinationPath "release/Average-Assistant-$version-Windows.zip"
      - name: Verify install, reinstall, uninstall, and data preservation
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter '*-Setup.exe'
          if (@($installer).Count -ne 1) { throw 'Expected exactly one installer' }
          & ./packaging/windows/test-installer.ps1 -Installer $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: Average-Assistant-Windows-Release
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish tested release files
        if: inputs.publish_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $expectedTag = "average-assistant-v$version"
          if ('${{ inputs.publish_tag }}' -ne $expectedTag) {
            throw "Publish tag must be $expectedTag"
          }
          $notes = @"
          ## Recommended download

          Download **Average-Assistant-$version-Setup.exe** and run it. Choose who can use the app and select any normal destination folder, including a folder directly on C:\ or another drive. Setup adds a Start menu shortcut, offers an optional desktop shortcut, and registers an uninstall entry.

          Updating or uninstalling keeps the separate saved bowler database. The portable ZIP is also included.

          ## Validation

          All 128 Windows application tests passed. The packaged installer passed default and custom C-drive installation, reinstall, shortcut, uninstall, and byte-for-byte database-preservation checks.
          "@
          gh release create $expectedTag release/* --target $env:GITHUB_SHA --title "Average Assistant $version — Selectable Install Folder" --notes $notes --latest
